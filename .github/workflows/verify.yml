name: Aegis Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source, contracts, and hardening
        run: npm run verify
      - name: Validate macOS launchers
        if: runner.os == 'macOS'
        shell: zsh {0}
        run: |
          for file in *.command; do
            zsh -n "$file"
          done
