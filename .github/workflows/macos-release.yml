name: Aegis macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Apple release credentials
        shell: zsh {0}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "$CSC_LINK" ]] || { echo "::error::Missing GitHub secret: MAC_CSC_LINK"; missing=1; }
          [[ -n "$CSC_KEY_PASSWORD" ]] || { echo "::error::Missing GitHub secret: MAC_CSC_KEY_PASSWORD"; missing=1; }
          [[ -n "$APPLE_ID" ]] || { echo "::error::Missing GitHub secret: APPLE_ID"; missing=1; }
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || { echo "::error::Missing GitHub secret: APPLE_APP_SPECIFIC_PASSWORD"; missing=1; }
          [[ -n "$APPLE_TEAM_ID" ]] || { echo "::error::Missing GitHub secret: APPLE_TEAM_ID"; missing=1; }
          (( missing == 0 ))

      - name: Install dependencies
        run: npm install

      - name: Verify source
        run: npm run verify

      - name: Build, sign, notarize and staple
        run: npm run dist:mac

      - name: Verify Gatekeeper and signatures
        shell: zsh {0}
        run: |
          set -euo pipefail
          for app in dist/mac*/Aegis\ Privacy\ Browser.app; do
            [[ -d "$app" ]] || continue
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type exec "$app"
            xcrun stapler validate "$app"
          done

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Privacy-Browser-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
